<div class="container mt-5">

  <h1 class="text-center text-primary mb-5">
    Sistema de Parqueadero
  </h1>

  <div class="card shadow p-4 mb-5">

    <h3 class="mb-4">
      Registrar Ingreso
    </h3>

    <div class="row">

      <div class="col-md-5">

        <input
          type="text"
          class="form-control"
          placeholder="Placa"
          [(ngModel)]="placa"
        >

      </div>

      <div class="col-md-4">

        <select
          class="form-select"
          [(ngModel)]="tipo"
        >
          <option>Carro</option>
          <option>Moto</option>
        </select>

      </div>

      <div class="col-md-3">

        <button
          class="btn btn-success w-100"
          (click)="registrarIngreso()"
        >
          Registrar
        </button>

      </div>

    </div>

  </div>

  <div class="card shadow p-4">

    <h3 class="mb-4">
      Vehículos Activos
    </h3>

    <table class="table table-bordered table-hover">

      <thead class="table-dark">

        <tr>
          <th>Placa</th>
          <th>Tipo</th>
          <th>Fecha Ingreso</th>
          <th>Acciones</th>
        </tr>

      </thead>

      <tbody>

        <tr *ngFor="let vehiculo of vehiculos">

          <td>{{ vehiculo.placa }}</td>

          <td>{{ vehiculo.tipo }}</td>

          <td>{{ vehiculo.fechaIngreso }}</td>

          <td>

            <button
              class="btn btn-danger btn-sm"
              (click)="registrarSalida(vehiculo.placa)"
            >
              Registrar Salida
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
