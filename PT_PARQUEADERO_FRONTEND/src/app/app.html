<div class="container py-5">

  <h1 class="titulo-principal text-center mb-5">

    <span class="texto-negro">
      SISTEMA DE
    </span>

    <span class="texto-parqueadero">

      <span class="texto-amarillo">PARQUE</span><span class="texto-azul">ADERO</span>

    </span>

  </h1>

  <div class="card shadow-lg border-0 rounded-4 p-4 mb-5">

    <h3 class="mb-4">
      Registrar Ingreso
    </h3>

    <div class="row">

      <div class="col-md-5">

        <input
          type="text"
          class="form-control"
          placeholder="Placa"
          [(ngModel)]="placa"
        >

      </div>

      <div class="col-md-4">

        <select
          class="form-select"
          [(ngModel)]="tipo"
        >
          <option>Carro</option>
          <option>Moto</option>
        </select>

      </div>

      <div class="col-md-3">

        <button
          class="btn btn-success w-100 fw-bold"
          (click)="registrarIngreso()"
        >
          Registrar
        </button>

      </div>

    </div>

  </div>

  <div class="card shadow-lg border-0 rounded-4 p-4">

    <h3 class="mb-4">
      Vehículos Activos
    </h3>

    <table class="table table-bordered table-hover">

      <thead class="table-dark">

        <tr>
          <th>Placa</th>
          <th>Tipo</th>
          <th>Fecha Ingreso</th>
          <th>Acciones</th>
        </tr>

      </thead>

      <tbody>

        <tr *ngIf="loading">

          <td colspan="4" class="text-center py-4">

            <div class="spinner-border text-primary"></div>

            <p class="mt-3 mb-0">
              Cargando vehículos...
            </p>

          </td>

        </tr>

        <tr *ngIf="!loading && vehiculos.length === 0">

          <td colspan="4" class="text-center py-4">

            <h5 class="text-muted">
              No hay vehículos activos
            </h5>

          </td>

        </tr>

        <tr *ngFor="let vehiculo of vehiculos">

          <td>
            <strong>{{ vehiculo.placa }}</strong>
          </td>

          <td>

            <span
              class="badge bg-primary"
              *ngIf="vehiculo.tipo === 'Carro'"
            >
              Carro
            </span>

            <span
              class="badge bg-dark"
              *ngIf="vehiculo.tipo === 'Moto'"
            >
              Moto
            </span>

          </td>

          <td>
            {{ vehiculo.fechaIngreso | date:'dd/MM/yyyy hh:mm a' }}
          </td>

          <td>

            <button
              class="btn btn-danger btn-sm fw-bold"
              (click)="registrarSalida(vehiculo.placa)"
            >
              Registrar Salida
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
